name: CI

on:
  push:
  pull_request:

jobs:
  ci-suite:
    name: Production CI Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ci-tests/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install locked CI dependencies
        working-directory: ci-tests
        run: npm ci --ignore-scripts

      - name: Full regression suite
        run: sh ci-tests/run-all.sh
