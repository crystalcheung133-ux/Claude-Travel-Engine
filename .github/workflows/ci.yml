name: CI

on:
  push:
  pull_request:

jobs:
  ci-suite:
    name: Production CI Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: JS syntax gate
        run: sh ci-tests/test-syntax.sh

      - name: Release integrity (checksums + manifest)
        run: sh ci-tests/test-checksums.sh

      - name: HTML structure
        run: sh ci-tests/test-html-structure.sh

      - name: Entity linkage (places/bookings/itinerary/parties)
        run: node ci-tests/test-entity-integrity.js

      - name: Guide address integrity
        run: python3 ci-tests/address-integrity-test.py

      - name: Timeline integrity
        run: node ci-tests/test-timeline-integrity.js

      - name: UX contract
        run: node ci-tests/test-ux-contract.js

      - name: Portability runtime audit
        run: node ci-tests/test-portability-runtime-v2.js

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Browser portability smoke
        run: node ci-tests/test-browser-portability.js


      - name: Runtime production integrity
        run: node ci-tests/test-runtime-integrity.js

      - name: VN reference integration
        run: node ci-tests/test-vn-reference-integration.js

      - name: RC8 presentation contract
        run: node ci-tests/test-rc8-presentation-contract.js

      - name: RC9 presentation contract
        run: node ci-tests/test-rc9-presentation-contract.js

      - name: RC10 presentation + guide contract
        run: node ci-tests/test-rc10-presentation-contract.js

      - name: RC11 sync + content contract
        run: node ci-tests/test-rc11-sync-content-contract.js

      - name: RC12 identity + UI contract
        run: node ci-tests/test-rc12-identity-ui-contract.js

      - name: RC14 cache + visual acceptance contract
        run: node ci-tests/test-rc14-cache-visual-contract.js

      - name: RC15 moments + timeline contract
        run: node ci-tests/test-rc15-moments-timeline-contract.js

      - name: RC16 guide + shopping contract
        run: node ci-tests/test-rc16-guide-shopping-contract.js

      - name: RC17 Guide content audit
        run: node ci-tests/test-rc17-guide-content-audit.js

      - name: RC18 Shopping navigation
        run: node ci-tests/test-rc18-shopping-navigation.js

      - name: Dual-currency Expenses
        run: node ci-tests/test-dual-currency-expenses.js .
