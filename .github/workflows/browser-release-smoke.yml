name: Browser Release Smoke

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright browsers + Ubuntu libraries are preinstalled in this image.
    # Avoid repeated apt downloads from azure.archive.ubuntu.com.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Playwright browsers
        run: |
          python -m playwright --version
          python - <<'PYCODE'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for name in ('chromium', 'webkit'):
                  browser = getattr(p, name).launch(headless=True)
                  print(name, 'launch OK')
                  browser.close()
          PYCODE
      - name: Run static Master CI
        run: sh ci-tests/run-all.sh
      - name: Run real browser release gate
        run: sh ci-tests/run-browser.sh
